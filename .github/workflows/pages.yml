name: Deploy to GitHub Pages

on:
  push:
    branches:
      - main
      # Pre-merge preview trigger. Remove this line once the branch is merged:
      # a push here deploys over the same live Pages site that main deploys to.
      - claude/howlett-carpentry-website-vk0zue
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  deploy:
    # No `environment: github-pages` binding here: the auto-created environment's
    # branch-protection rule only allows deploys from the default branch, which
    # blocks this job while it's still also triggered from a feature branch (see
    # the `branches` list above). Once the feature branch is deleted and only
    # `main` remains as a trigger, this can be restored to get deployment-URL
    # visibility in the repo's Environments tab.
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Setup Pages
        uses: actions/configure-pages@v5
      - name: Upload artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: '.'
      # The Pages backend intermittently rejects deployments with a transient
      # "Deployment failed, try again later" error; a short-delay retry has
      # reliably fixed it, so bake one retry (then a second) into the job.
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
        continue-on-error: true
      - name: Wait before retrying the deploy
        if: steps.deployment.outcome == 'failure'
        run: sleep 30
      - name: Retry deploy to GitHub Pages
        id: deployment-retry
        if: steps.deployment.outcome == 'failure'
        uses: actions/deploy-pages@v4
        continue-on-error: true
      - name: Wait before the final deploy attempt
        if: steps.deployment.outcome == 'failure' && steps.deployment-retry.outcome == 'failure'
        run: sleep 60
      - name: Final deploy attempt
        if: steps.deployment.outcome == 'failure' && steps.deployment-retry.outcome == 'failure'
        uses: actions/deploy-pages@v4
